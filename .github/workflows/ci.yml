# Every push, on every branch: Biome, types, knip and every unit test. The e2e
# run is its own workflow (e2e.yml), only for pushes that change the app.
# Pushes that only touch docs skip both.
name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

# a new push to the same branch cancels the run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, types, knip, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test
